<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Paper sheet: tighter bounds leave more margin for visibility at 16x16. -->
  <rect x="5" y="4" width="22" height="24" rx="1.4"
        fill="#f4efe3" stroke="#1a1a1a" stroke-width="1.3"/>

  <!-- Masthead top rule -->
  <line x1="6.5" y1="7.5" x2="25.5" y2="7.5"
        stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Crosswire: zig-zag wire with diagonal cross-ties, a visual play
       on the paper's name. -->
  <polyline points="7,11 10,9.8 13,12.2 16,9.8 19,12.2 22,9.8 25,11"
            fill="none" stroke="#1a1a1a" stroke-width="0.9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cross ties: short strokes inclined across the wire, same slant
       so they read as anchors on a taut cable. -->
  <line x1="9" y1="9.3" x2="11" y2="12.7" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="12" y1="9.3" x2="14" y2="12.7" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="15" y1="9" x2="17" y2="13" stroke="#1a1a1a" stroke-width="0.95" stroke-linecap="round"/>
  <line x1="18" y1="9.3" x2="20" y2="12.7" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="21" y1="9.3" x2="23" y2="12.7" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Masthead bottom rule -->
  <line x1="6.5" y1="14.2" x2="25.5" y2="14.2"
        stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Column gutter -->
  <line x1="16" y1="15.5" x2="16" y2="26"
        stroke="#1a1a1a" stroke-width="0.4"/>

  <!-- Left column text lines -->
  <line x1="7" y1="17.2" x2="14.5" y2="17.2" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="7" y1="19.4" x2="14.5" y2="19.4" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="7" y1="21.6" x2="14.5" y2="21.6" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="7" y1="23.8" x2="12.5" y2="23.8" stroke="#1a1a1a" stroke-width="0.6"/>

  <!-- Right column text lines -->
  <line x1="17.5" y1="17.2" x2="25" y2="17.2" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="17.5" y1="19.4" x2="25" y2="19.4" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="17.5" y1="21.6" x2="23" y2="21.6" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="17.5" y1="23.8" x2="25" y2="23.8" stroke="#1a1a1a" stroke-width="0.6"/>
</svg>
